# Copy this file, edit values for a run, then launch with:
# nextflow run main.nf -params-file your-run.params.yml

# Annotation tools to run. Any subset of celltypist, scanvi, panhumanpy.
# Accepts a comma-separated string or a YAML list.
tools: celltypist,scanvi,panhumanpy

# Required inputs
# ref_h5ad and ref_label_col are only needed when tools includes celltypist or scanvi;
# a panhumanpy-only run needs the query alone.
ref_h5ad: /path/to/reference.h5ad
project_tag: autoannotate_run
ref_label_col: cell_type

# query_h5ad accepts one path, a glob, or a list. Each query is annotated separately and
# gets its own output subdirectory named after the file (without its extension).
query_h5ad: /path/to/query.h5ad
# query_h5ad: /path/to/queries/*.h5ad
# query_h5ad:
#   - /path/to/donor1.h5ad
#   - /path/to/donor2.h5ad

# Optional output location
outdir: results/autoannotate_run

# Optional reference filtering
ref_filter_col: null
ref_filter_values: null

# Optional pretrained model reuse
celltypist_model: null
scanvi_model_dir: null
scvi_reference_model_dir: null

# Output column names and merge behavior
scanvi_obs_col: scanvi_label
scanvi_score_col: scanvi_confidence
query_cluster_col: leiden
compute_missing_clusters: false

# Merge the per-tool predictions into the query h5ad and build the cluster summary and
# marker genes. Set false to publish the prediction tables alone, which skips the slowest
# and most memory-hungry step of a run. query_cluster_col is then not required either.
merge_annotations: true
marker_genes_n_top: 50
marker_genes_method: wilcoxon
marker_dotplot: true
marker_dotplot_n_top: 5

# scVI/scANVI setup and model controls
batch_key: null
scvi_layer: null
scanvi_categorical_covariate_keys: null
scanvi_continuous_covariate_keys: null
scanvi_hvg_n_top_genes: 2500
unknown_label: Unknown

scvi_n_hidden: null                 # scvi-tools default: 128
scvi_n_latent: null                 # scvi-tools default: 10
scvi_n_layers: null                 # scvi-tools default: 1
scvi_dropout_rate: null             # scvi-tools default: 0.1
scvi_dispersion: null               # scvi-tools default: gene
scvi_gene_likelihood: null          # scvi-tools default: zinb
scvi_latent_distribution: null      # scvi-tools default: normal

scvi_train_max_epochs: null         # scvi-tools heuristic: 400 if n_obs <= 20000; otherwise max(1, round((20000 / n_obs) * 400))
scvi_train_batch_size: null         # scvi-tools default: 128
scvi_train_train_size: null         # scvi-tools default: effectively 0.9
scvi_train_validation_size: null    # scvi-tools default: 1 - train_size, effectively 0.1
scvi_train_early_stopping: null     # scvi-tools default: false
scvi_train_early_stopping_patience: null  # scvi-tools Trainer default: 45, only used if early stopping is true

scanvi_train_max_epochs: null       # scvi-tools heuristic; from pretrained scVI, reduced to min(10, max(2, round(heuristic / 3)))
scanvi_train_batch_size: null       # scvi-tools default: 128
scanvi_train_train_size: null       # scvi-tools default: 0.9
scanvi_train_validation_size: null  # scvi-tools default: 1 - train_size, effectively 0.1
scanvi_train_early_stopping: null   # scvi-tools Trainer default: false
scanvi_train_early_stopping_patience: null  # scvi-tools Trainer default: 45, only used if early stopping is true

scanvi_query_max_epochs: 100
scanvi_query_batch_size: null       # scvi-tools default: 128
scanvi_query_train_size: null       # scvi-tools default: 0.9
scanvi_query_validation_size: null  # scvi-tools default: 1 - train_size, effectively 0.1
scanvi_query_early_stopping: null   # scvi-tools Trainer default: false
scanvi_query_early_stopping_patience: null  # scvi-tools Trainer default: 45, only used if early stopping is true
scanvi_query_check_val_every_n_epoch: 10
scanvi_query_plan_weight_decay: 0.0

# PanHumanPy controls
panhumanpy_feature_names_col: null

# CellTypist controls
celltypist_training_mode: detailed
celltypist_balance_cells_per_label: 500
celltypist_feature_selection: true
celltypist_feature_selection_top_genes: 100
celltypist_feature_selection_max_iter: 5
celltypist_max_iter: 100
celltypist_use_gpu: true
